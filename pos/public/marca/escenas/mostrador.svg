<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-label="Un mostrador con su caja, el comprobante saliendo y la estantería detrás">
  <defs>
    <linearGradient id="m-losa" x1="90" y1="326" x2="670" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9a257"/><stop offset=".48" stop-color="#a8802f"/><stop offset="1" stop-color="#6b4f20"/>
    </linearGradient>
    <linearGradient id="m-frente" x1="90" y1="352" x2="300" y2="478" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2318"/><stop offset="1" stop-color="#16120c"/>
    </linearGradient>
    <linearGradient id="m-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m-acero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6"/><stop offset=".55" stop-color="#cbd2dd"/><stop offset="1" stop-color="#a8b0be"/>
    </linearGradient>
    <linearGradient id="m-acero-osc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f99a9"/><stop offset="1" stop-color="#5b6675"/>
    </linearGradient>
    <linearGradient id="m-bronce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a257"/><stop offset="1" stop-color="#8a6628"/>
    </linearGradient>
    <linearGradient id="m-papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#e4dccb"/>
    </linearGradient>
    <linearGradient id="m-luz" x1="236" y1="92" x2="236" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9a257" stop-opacity=".30"/><stop offset="1" stop-color="#c9a257" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="m-halo" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#a8802f" stop-opacity=".34"/><stop offset="1" stop-color="#a8802f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-difuminado" cx=".5" cy=".45" r=".58">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m-desvanece"><rect width="760" height="620" fill="url(#m-difuminado)"/></mask>
    <radialGradient id="m-sombra" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000000" stop-opacity=".55"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo cálido: la escena nace de una luz, no de un fondo plano. -->
  <rect width="760" height="620" fill="url(#m-halo)"/>

  <!-- Pared del fondo. Va con máscara de desvanecido porque un rectángulo
       plano dejaba cuatro cantos duros flotando en el aire. -->
  <rect x="40" y="0" width="680" height="470" fill="#ffffff" opacity=".03" mask="url(#m-desvanece)"/>

  <!-- Lámpara colgante y su cono de luz. -->
  <g>
    <path d="M236 0v86" stroke="#6b4f20" stroke-width="3" stroke-linecap="round"/>
    <path d="M196 120c0-22 18-34 40-34s40 12 40 34z" fill="url(#m-bronce)"/>
    <ellipse cx="236" cy="120" rx="40" ry="7" fill="#413017"/>
    <circle cx="236" cy="118" r="9" fill="#f8f1e2" opacity=".9"/>
    <path d="M206 124 150 372h172L266 124z" fill="url(#m-luz)"/>
  </g>

  <!-- Estantería del fondo con frascos y cajas. -->
  <g>
    <rect x="420" y="168" width="248" height="9" rx="4" fill="#3a3730"/>
    <rect x="440" y="124" width="34" height="44" rx="6" fill="url(#m-acero)" opacity=".55"/>
    <rect x="484" y="136" width="26" height="32" rx="5" fill="#8a6628" opacity=".65"/>
    <rect x="520" y="118" width="30" height="50" rx="7" fill="url(#m-acero)" opacity=".4"/>
    <rect x="560" y="140" width="40" height="28" rx="5" fill="#c9a257" opacity=".45"/>
    <rect x="610" y="128" width="28" height="40" rx="6" fill="url(#m-acero)" opacity=".5"/>

    <rect x="420" y="256" width="248" height="9" rx="4" fill="#3a3730"/>
    <rect x="452" y="214" width="44" height="42" rx="6" fill="#8a6628" opacity=".5"/>
    <rect x="506" y="226" width="30" height="30" rx="5" fill="url(#m-acero)" opacity=".42"/>
    <rect x="546" y="208" width="36" height="48" rx="6" fill="#c9a257" opacity=".35"/>
    <rect x="592" y="222" width="46" height="34" rx="5" fill="url(#m-acero)" opacity=".5"/>
  </g>

  <!-- Sombra del conjunto sobre el suelo. -->
  <ellipse cx="380" cy="486" rx="300" ry="26" fill="url(#m-sombra)"/>

  <!-- Mostrador: losa de bronce y frente oscuro con dos entrepaños. -->
  <g>
    <rect x="86" y="326" width="588" height="26" rx="8" fill="url(#m-losa)"/>
    <rect x="86" y="326" width="588" height="8" rx="4" fill="#e8d4a8" opacity=".55"/>
    <path d="M98 352h564v118H98z" fill="url(#m-frente)"/>
    <path d="M98 352h564v118H98z" fill="url(#m-panel)"/>
    <rect x="132" y="378" width="222" height="66" rx="8" fill="#ffffff" opacity=".035"/>
    <rect x="406" y="378" width="222" height="66" rx="8" fill="#ffffff" opacity=".035"/>
  </g>

  <!-- La caja: el producto, en el centro de la escena. -->
  <g>
    <!-- cuerpo -->
    <path d="M292 252h176a16 16 0 0 1 16 16v38H276v-38a16 16 0 0 1 16-16z" fill="url(#m-acero-osc)"/>
    <!-- cajón entreabierto -->
    <rect x="266" y="300" width="228" height="30" rx="9" fill="url(#m-acero)" opacity=".72"/>
    <rect x="352" y="310" width="56" height="9" rx="4.5" fill="#5b6675" opacity=".75"/>
    <!-- pantalla inclinada -->
    <path d="M318 196h124l20 56H298z" fill="#1d2838"/>
    <path d="M330 208h100l12 32H318z" fill="#c9a257" opacity=".22"/>
    <!-- borde bronce del frente -->
    <path d="M276 294h208v12H276z" fill="url(#m-bronce)" opacity=".85"/>
  </g>

  <!-- Comprobante saliendo, con el borde rizado. -->
  <g>
    <path d="M356 112h76v84l-76 10z" fill="url(#m-papel)"/>
    <path d="M432 112c16-4 26 4 26 16s-12 18-26 14z" fill="#8a6628"/>
    <path d="M356 206l76-10v10l-12 8-14-6-13 7-13-6-12 7z" fill="#e4dccb"/>
    <rect x="370" y="134" width="48" height="7" rx="3.5" fill="#c9a257" opacity=".75"/>
    <rect x="370" y="150" width="40" height="7" rx="3.5" fill="#c9a257" opacity=".6"/>
    <rect x="370" y="166" width="30" height="7" rx="3.5" fill="#c9a257" opacity=".45"/>
  </g>

  <!-- Terminal de pago sobre su pie. -->
  <g>
    <rect x="552" y="306" width="10" height="22" rx="4" fill="#3a3730"/>
    <rect x="528" y="322" width="58" height="8" rx="4" fill="#3a3730"/>
    <g transform="rotate(-14 557 282)">
      <rect x="532" y="246" width="50" height="72" rx="10" fill="url(#m-acero-osc)"/>
      <rect x="540" y="254" width="34" height="24" rx="4" fill="#c9a257" opacity=".3"/>
      <circle cx="548" cy="290" r="4" fill="#cbd2dd" opacity=".8"/>
      <circle cx="560" cy="290" r="4" fill="#cbd2dd" opacity=".8"/>
      <circle cx="572" cy="290" r="4" fill="#cbd2dd" opacity=".8"/>
      <circle cx="548" cy="302" r="4" fill="#cbd2dd" opacity=".8"/>
      <circle cx="560" cy="302" r="4" fill="#cbd2dd" opacity=".8"/>
      <circle cx="572" cy="302" r="4" fill="#c9a257"/>
    </g>
  </g>

  <!-- Bolsa de papel y una caja, a la izquierda. -->
  <g>
    <path d="M150 262h78l10 64h-98z" fill="url(#m-bronce)" opacity=".9"/>
    <path d="M150 262h78l4 12h-86z" fill="#e8d4a8" opacity=".5"/>
    <path d="M172 262c0-14 8-22 18-22s18 8 18 22" stroke="#6b4f20" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="236" y="288" width="48" height="38" rx="6" fill="url(#m-acero)" opacity=".45"/>
    <rect x="236" y="302" width="48" height="7" fill="#8a6628" opacity=".55"/>
  </g>

  <!-- Monedas y destellos sueltos: dan aire y profundidad. -->
  <g opacity=".85">
    <ellipse cx="636" cy="316" rx="15" ry="5" fill="#c9a257"/>
    <ellipse cx="636" cy="310" rx="15" ry="5" fill="#e8d4a8"/>
    <ellipse cx="610" cy="320" rx="13" ry="4.5" fill="#a8802f"/>
  </g>
  <g fill="#e8d4a8">
    <circle cx="124" cy="150" r="4" opacity=".5"/>
    <circle cx="684" cy="92" r="5" opacity=".35"/>
    <circle cx="700" cy="400" r="4" opacity=".3"/>
    <circle cx="96" cy="240" r="3" opacity=".45"/>
    <circle cx="330" cy="78" r="3.5" opacity=".4"/>
  </g>
</svg>
